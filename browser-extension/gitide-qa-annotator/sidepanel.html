<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Act IA QA</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #0f0f10;
      color: #f8fafc;
    }

    body {
      overflow: auto;
    }

    main {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      margin-bottom: 14px;
    }

    header span {
      color: #9ca3af;
      font-size: 11px;
    }

    h1 {
      margin: 2px 0 4px;
      font-size: 20px;
    }

    header p {
      margin: 0;
      color: #a1a1aa;
      font-size: 12px;
      line-height: 1.4;
    }

    .panel {
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      background: #17171a;
    }

    .panel-title {
      color: #f8fafc;
      font-size: 13px;
      font-weight: 800;
    }

    label {
      display: block;
      margin: 11px 0 6px;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 700;
    }

    .field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 11px 0 6px;
    }

    .field-header label {
      margin: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      min-height: 38px;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: #101012;
      color: #f8fafc;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: #242428;
      color: #f8fafc;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(255,255,255,.22);
      background: #2b2b30;
    }

    button.primary,
    #saveConfig {
      width: 100%;
      margin-top: 12px;
      background: #ffffff;
      color: #111827;
    }

    button.secondary {
      width: 100%;
      margin-top: 8px;
      background: #17171a;
      color: #f8fafc;
    }

    button.inline-action {
      min-width: 34px;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 11px;
    }

    button.icon-only {
      width: 30px;
      min-width: 30px;
      padding: 0;
      font-size: 14px;
      line-height: 1;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(120px, 150px);
      gap: 10px;
      align-items: end;
    }

    .selector-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px;
      gap: 8px;
    }

    .checkline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .checkline input {
      width: 16px;
      min-height: 16px;
    }

    #status {
      min-height: 20px;
      margin: 0 0 10px;
      color: #a1a1aa;
      font-size: 12px;
    }

  </style>
</head>
<body>
  <main>
    <header>
      <span>Act IA</span>
      <h1>QA Annotator</h1>
      <p>Selecione elementos, registre evidências e envie tudo para a página QA do Act IA.</p>
    </header>

    <section class="panel">
      <div class="panel-title">Conexão</div>
      <label>API Base</label>
      <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000">
      <label>Project ID</label>
      <input id="projectId" type="number" placeholder="1">
      <label>Token</label>
      <input id="token" type="password" placeholder="Bearer Token do Act IA">
      <button id="saveConfig" type="button">Salvar configuração</button>
      <button id="testConnection" type="button" class="secondary">Testar conexão</button>
    </section>

    <section class="panel">
      <div class="panel-title">Nova anotação</div>
      <label for="category">Tipo de bug</label>
      <select id="category">
        <option value="functional">1. Funcionais</option>
        <option value="interface">2. Interface</option>
        <option value="content">3. Conteúdo</option>
        <option value="interaction">4. Interação</option>
        <option value="design">5. Design</option>
        <option value="structure">6. Estrutura</option>
        <option value="visual">7. Visual</option>
      </select>
      <div class="row">
        <label for="severity">Severidade</label>
        <select id="severity">
          <option value="medium">Média</option>
          <option value="low">Baixa</option>
          <option value="high">Alta</option>
          <option value="critical">Crítica</option>
        </select>
      </div>
      <div class="field-header">
        <label for="title">Título</label>
        <button id="generateTitle" type="button" class="inline-action icon-only" title="Gerar título curto pela descrição">✦</button>
      </div>
      <input id="title" type="text" placeholder="Ex: botão salvar não responde">
      <div class="field-header">
        <label for="description">Descrição</label>
        <button id="polishDescription" type="button" class="inline-action" title="Reescrever a descrição com mais clareza">IA</button>
      </div>
      <textarea id="description" placeholder="Descreva o problema, onde ocorre, comportamento esperado e evidência..."></textarea>
      <label>Elemento</label>
      <div class="selector-row">
        <input id="selector" type="text" placeholder="Selecione um elemento" readonly>
        <button id="pickElement" type="button" title="Selecionar elemento">Alvo</button>
      </div>
      <label class="checkline">
        <input id="includeScreenshot" type="checkbox" checked>
        incluir screenshot da aba
      </label>
      <button id="sendAnnotation" type="button" class="primary">Enviar anotação</button>
    </section>

    <p id="status"></p>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
