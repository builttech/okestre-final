<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Act IA QA</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main>
    <header>
      <span>Act IA</span>
      <h1>QA Annotator</h1>
      <p>Selecione elementos, registre evidências e envie tudo para a página QA do Act IA.</p>
    </header>

    <section class="panel">
      <div class="panel-title">Conexão</div>
      <label>API Base</label>
      <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000">
      <label>Project ID</label>
      <input id="projectId" type="number" placeholder="1">
      <label>Token</label>
      <input id="token" type="password" placeholder="Bearer Token do Act IA">
      <button id="saveConfig" type="button">Salvar configuração</button>
      <button id="testConnection" type="button" class="secondary">Testar conexão</button>
    </section>

    <section class="panel">
      <div class="panel-title">Nova anotação</div>
      <label for="category">Tipo de bug</label>
      <select id="category">
        <option value="functional">1. Funcionais</option>
        <option value="interface">2. Interface</option>
        <option value="content">3. Conteúdo</option>
        <option value="interaction">4. Interação</option>
        <option value="design">5. Design</option>
        <option value="structure">6. Estrutura</option>
        <option value="visual">7. Visual</option>
      </select>
      <div class="row">
        <label for="severity">Severidade</label>
        <select id="severity">
          <option value="medium">Média</option>
          <option value="low">Baixa</option>
          <option value="high">Alta</option>
          <option value="critical">Crítica</option>
        </select>
      </div>
      <div class="field-header">
        <label for="title">Título</label>
        <button id="generateTitle" type="button" class="inline-action icon-only" title="Gerar título curto pela descrição">✦</button>
      </div>
      <input id="title" type="text" placeholder="Ex: botão salvar não responde">
      <div class="field-header">
        <label for="description">Descrição</label>
        <button id="polishDescription" type="button" class="inline-action" title="Reescrever a descrição com mais clareza">IA</button>
      </div>
      <textarea id="description" placeholder="Descreva o problema, onde ocorre, comportamento esperado e evidência..."></textarea>
      <label>Elemento</label>
      <div class="selector-row">
        <input id="selector" type="text" placeholder="Selecione um elemento" readonly>
        <button id="pickElement" type="button" title="Selecionar elemento">Alvo</button>
      </div>
      <label class="checkline">
        <input id="includeScreenshot" type="checkbox" checked>
        incluir screenshot da aba
      </label>
      <button id="sendAnnotation" type="button" class="primary">Enviar anotação</button>
    </section>

    <p id="status"></p>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
