<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagramas ER · Okestre</title><link rel="stylesheet" href="/static/er-diagram.css?v=1"><script defer src="/static/vendor/mermaid-11.12.0.min.js"></script><script defer src="/static/er-diagram.js?v=1"></script></head>
<body><header><a href="/" class="brand">← Okestre</a><div><strong>Diagramas ER</strong><small>Entidades e relacionamentos</small></div><input id="title" aria-label="Nome do diagrama" value="Modelo de pedidos" maxlength="100"><button id="new">Novo</button><button id="example">Exemplo</button><button id="import">Importar .mmd</button><input id="file" type="file" accept=".mmd,.mermaid,.txt" hidden><button id="export" class="primary">Exportar Mermaid</button><button id="svg-export">Exportar SVG</button></header>
<main><aside><nav aria-label="Editor"><button data-tab="entities" aria-pressed="true">Entidades</button><button data-tab="relations" aria-pressed="false">Relações</button><button data-tab="code" aria-pressed="false">Código</button></nav>
<section id="entities"><div class="section-head"><h2>Entidades</h2><button id="add-entity">+ Entidade</button></div><select id="entity-select" aria-label="Selecionar entidade"></select><div id="entity-editor"></div></section>
<section id="relations" hidden><div class="section-head"><h2>Relacionamentos</h2><button id="add-relation">+ Relação</button></div><div id="relation-editor"></div></section>
<section id="code" hidden><label for="source">Código Mermaid</label><textarea id="source" spellcheck="false"></textarea><button id="apply" class="primary">Aplicar código</button><button id="copy">Copiar código</button><p>Edite entidades, atributos e relações em <code>erDiagram</code>. Aplicar código atualiza o editor visual.</p></section>
<footer><span id="saved">Rascunho neste navegador</span><p id="message" role="status" aria-live="polite"></p></footer></aside>
<article><div class="canvas-toolbar"><label>Direção <select id="direction"><option value="TB">De cima para baixo</option><option value="LR">Da esquerda para direita</option><option value="BT">De baixo para cima</option><option value="RL">Da direita para esquerda</option></select></label><span id="counts"></span><button id="zoom-out" aria-label="Diminuir zoom">−</button><button id="fit">Ajustar</button><button id="zoom-in" aria-label="Aumentar zoom">+</button></div><div id="viewport"><div id="preview" aria-label="Prévia do diagrama"></div><div id="empty" hidden>Adicione uma entidade para começar seu diagrama.</div></div></article></main></body></html>
