<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Conexão · Okestre Desktop</title><link rel="stylesheet" href="/static/rebrand.css"><style>body{padding:40px;max-width:1000px;margin:auto}button{padding:12px;margin:8px}#status{margin:24px 0}a{color:inherit}</style></head><body><a href="/">← Voltar ao Okestre completo</a><h1>Agente local e VM</h1><p>O agente existente mantém a conexão com o ChatGPT. O Desktop usa as pastas deste computador.</p><p id="server"></p><p id="status" role="status">Consultando…</p><button data-action="connection">Atualizar status</button><button data-action="choose_agent">Selecionar OkestreLocal.exe existente</button><button data-action="open_agent">Abrir agente / parear</button><button data-action="open_vm">Abrir painel da VM</button><script>
const key='__DESKTOP_KEY__';async function action(name){try{const r=await fetch('/desktop/action',{method:'POST',headers:{'Content-Type':'application/json','X-Desktop-Key':key},body:JSON.stringify({action:name})});const v=await r.json();if(!v.ok)throw Error(v.error||v.detail);document.getElementById('status').textContent=v.data?.message|| (typeof v.data==='string'?v.data:'Pronto.');return v.data;}catch(e){document.getElementById('status').textContent=e.message;}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));action('state').then(v=>{document.getElementById('server').textContent=v?.server||'Nenhum pareamento encontrado';action('connection');});
</script></body></html>
